<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1760" viewBox="0 0 1920 1760" role="img" aria-labelledby="title desc">
  <title id="title">Commerce Ops 当前系统架构</title>
  <desc id="desc">展示统一 Vue 工作台、AI Agent Foundation、任务治理、Commerce API Gateway、平台 Connector、多店铺授权、业务数据域、SQLite 正式库和 PostgreSQL 迁移目标。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#12233f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#73809a"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .bg { fill:#f4f7fb; }
      .panel { fill:#ffffff; stroke:#dce4ef; stroke-width:2; filter:url(#shadow); }
      .layer { font:700 19px "Microsoft YaHei","PingFang SC",sans-serif; fill:#65738d; letter-spacing:2px; }
      .title { font:700 38px "Microsoft YaHei","PingFang SC",sans-serif; fill:#0f1f38; }
      .subtitle { font:400 18px "Microsoft YaHei","PingFang SC",sans-serif; fill:#64748b; }
      .head { font:700 22px "Microsoft YaHei","PingFang SC",sans-serif; fill:#14233b; }
      .body { font:400 17px "Microsoft YaHei","PingFang SC",sans-serif; fill:#526078; }
      .small { font:400 15px "Microsoft YaHei","PingFang SC",sans-serif; fill:#64748b; }
      .tiny { font:600 13px "Microsoft YaHei","PingFang SC",sans-serif; }
      .chip { font:600 15px "Microsoft YaHei","PingFang SC",sans-serif; fill:#334155; }
      .white { fill:#ffffff; }
      .blueBox { fill:#edf4ff; stroke:#8db3ff; stroke-width:2; }
      .navyBox { fill:#13223c; stroke:#13223c; stroke-width:2; }
      .greenBox { fill:#ecfdf4; stroke:#80d8a7; stroke-width:2; }
      .amberBox { fill:#fff7e6; stroke:#f2c675; stroke-width:2; }
      .violetBox { fill:#f6f0ff; stroke:#c7a7f5; stroke-width:2; }
      .grayBox { fill:#f8fafc; stroke:#cbd5e1; stroke-width:2; }
      .futureBox { fill:#fbfcfe; stroke:#aab5c5; stroke-width:2; stroke-dasharray:9 7; }
      .statusLive { fill:#dcfce7; stroke:#86efac; }
      .statusGuard { fill:#fff2cc; stroke:#f2c96d; }
      .statusFuture { fill:#eef2f7; stroke:#cbd5e1; }
      .line { fill:none; stroke:#73809a; stroke-width:3; marker-end:url(#arrow); }
      .blueLine { fill:none; stroke:#2563eb; stroke-width:3.5; marker-end:url(#arrowBlue); }
      .dashLine { fill:none; stroke:#98a3b5; stroke-width:3; stroke-dasharray:9 8; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect class="bg" width="1920" height="1760"/>

  <text id="titleText" class="title" x="70" y="66">Commerce Ops 当前系统架构</text>
  <text class="subtitle" x="70" y="100">企业级跨境电商运营平台 · 当前实现与目标边界 · 2026-08-06</text>
  <g transform="translate(1450,48)">
    <rect class="statusLive" x="0" y="0" rx="14" width="118" height="34"/>
    <text class="tiny" fill="#167747" x="59" y="22" text-anchor="middle">● 已实现</text>
    <rect class="statusGuard" x="130" y="0" rx="14" width="138" height="34"/>
    <text class="tiny" fill="#946200" x="199" y="22" text-anchor="middle">◆ 受控 / 护栏</text>
    <rect class="statusFuture" x="280" y="0" rx="14" width="118" height="34"/>
    <text class="tiny" fill="#596579" x="339" y="22" text-anchor="middle">○ 目标态</text>
  </g>

  <!-- Actors -->
  <rect class="panel" x="50" y="130" rx="24" width="1820" height="130"/>
  <text class="layer" x="82" y="170">01 · USERS &amp; ACTORS</text>
  <g transform="translate(510,154)">
    <rect class="grayBox" x="0" y="0" rx="16" width="280" height="78"/>
    <text class="head" x="140" y="34" text-anchor="middle">运营人员 / 管理者</text>
    <text class="small" x="140" y="59" text-anchor="middle">查看 · 审批 · 执行 · 追踪</text>
  </g>
  <g transform="translate(820,154)">
    <rect class="blueBox" x="0" y="0" rx="16" width="280" height="78"/>
    <text class="head" x="140" y="34" text-anchor="middle">业务模块</text>
    <text class="small" x="140" y="59" text-anchor="middle">统一调用应用服务与 Gateway</text>
  </g>
  <g transform="translate(1130,154)">
    <rect class="violetBox" x="0" y="0" rx="16" width="280" height="78"/>
    <text class="head" x="140" y="34" text-anchor="middle">AI Agent</text>
    <text class="small" x="140" y="59" text-anchor="middle">仅通过 Context / Tool Runtime</text>
  </g>

  <path class="line" d="M960 260 L960 290"/>

  <!-- Experience -->
  <rect class="panel" x="50" y="290" rx="24" width="1820" height="190"/>
  <text class="layer" x="82" y="330">02 · EXPERIENCE LAYER</text>
  <rect class="navyBox" x="82" y="350" rx="18" width="330" height="95"/>
  <text class="head white" x="247" y="387" text-anchor="middle">Commerce Ops Vue 3 工作台</text>
  <text class="small white" x="247" y="417" text-anchor="middle">Router · Pinia · Element Plus · ECharts</text>
  <g>
    <rect class="grayBox" x="445" y="350" rx="14" width="205" height="44"/><text class="chip" x="548" y="378" text-anchor="middle">运营总览</text>
    <rect class="grayBox" x="666" y="350" rx="14" width="205" height="44"/><text class="chip" x="769" y="378" text-anchor="middle">产品 / 销售 / 库存</text>
    <rect class="grayBox" x="887" y="350" rx="14" width="205" height="44"/><text class="chip" x="990" y="378" text-anchor="middle">Growth / 竞品 / 广告</text>
    <rect class="grayBox" x="1108" y="350" rx="14" width="205" height="44"/><text class="chip" x="1211" y="378" text-anchor="middle">Listing / 履约 / 控价</text>
    <rect class="greenBox" x="1329" y="350" rx="14" width="225" height="44"/><text class="chip" x="1442" y="378" text-anchor="middle">平台 API 接入</text>
    <rect class="violetBox" x="1570" y="350" rx="14" width="225" height="44"/><text class="chip" x="1683" y="378" text-anchor="middle">Agent 监控</text>
    <rect class="statusLive" x="445" y="411" rx="13" width="176" height="32"/><text class="tiny" fill="#167747" x="533" y="432" text-anchor="middle">主工作台已启用</text>
    <text class="small" x="646" y="433">新增：40 家店铺连接状态、授权健康度、Agent 运行链路可视化</text>
  </g>

  <path class="line" d="M960 480 L960 510"/>

  <!-- Application & AI -->
  <rect class="panel" x="50" y="510" rx="24" width="1820" height="270"/>
  <text class="layer" x="82" y="550">03 · APPLICATION, AI &amp; GOVERNANCE</text>
  <g transform="translate(82,575)">
    <rect class="blueBox" x="0" y="0" rx="18" width="505" height="160"/>
    <text class="head" x="24" y="38">Node.js 主服务 / 应用 API</text>
    <text class="body" x="24" y="72">模块化业务服务 · HTTP 路由 · Provider Repository</text>
    <text class="body" x="24" y="102">产品 · 销售 · 库存 · 控价 · Listing · 履约 · 分析</text>
    <rect class="statusLive" x="24" y="120" rx="12" width="108" height="27"/>
    <text class="tiny" fill="#167747" x="78" y="139" text-anchor="middle">正式运行</text>
  </g>
  <g transform="translate(608,575)">
    <rect class="violetBox" x="0" y="0" rx="18" width="695" height="160"/>
    <text class="head" x="24" y="38">AI Agent Foundation 1.4.1</text>
    <text class="body" x="24" y="72">AI Gateway → Agent Runtime → Context Registry → Tool Registry</text>
    <text class="body" x="24" y="102">版本化契约 · 权限控制 · Token 统计 · Evaluation · Monitoring</text>
    <rect class="statusLive" x="24" y="120" rx="12" width="160" height="27"/>
    <text class="tiny" fill="#167747" x="104" y="139" text-anchor="middle">Runtime 边界已实现</text>
  </g>
  <g transform="translate(1324,575)">
    <rect class="amberBox" x="0" y="0" rx="18" width="471" height="160"/>
    <text class="head" x="24" y="38">任务、审批与审计治理</text>
    <text class="body" x="24" y="72">Foundation Task · Scheduler · Worker</text>
    <text class="body" x="24" y="102">人工审批 · 幂等 · Audit · Agent Observability</text>
    <rect class="statusGuard" x="24" y="120" rx="12" width="182" height="27"/>
    <text class="tiny" fill="#946200" x="115" y="139" text-anchor="middle">外部写操作默认关闭</text>
  </g>
  <path class="blueLine" d="M587 655 L608 655"/>
  <path class="blueLine" d="M1303 655 L1324 655"/>

  <path class="line" d="M960 780 L960 810"/>

  <!-- Integration -->
  <rect class="panel" x="50" y="810" rx="24" width="1820" height="345"/>
  <text class="layer" x="82" y="850">04 · COMMERCE API GATEWAY &amp; CONNECTOR LAYER</text>
  <g transform="translate(82,875)">
    <rect class="navyBox" x="0" y="0" rx="18" width="360" height="105"/>
    <text class="head white" x="180" y="40" text-anchor="middle">Commerce API Gateway</text>
    <text class="small white" x="180" y="70" text-anchor="middle">统一店铺解析 · Token 获取 · 标准响应</text>
    <text class="small white" x="180" y="92" text-anchor="middle">业务模块 / Agent 禁止直连平台 API</text>
  </g>
  <path class="blueLine" d="M442 928 L480 928"/>
  <g transform="translate(480,875)">
    <rect class="blueBox" x="0" y="0" rx="18" width="875" height="105"/>
    <text class="head" x="24" y="37">Platform Connector Registry</text>
    <text class="body" x="24" y="68">BaseConnector · 统一能力契约 · 自动刷新 Token · 读重试 · ApiRequestLog</text>
    <text class="body" x="24" y="92">AES-256-GCM Token 加密 · credential group 锁 · 写能力 fail-closed</text>
  </g>
  <g transform="translate(1375,875)">
    <rect class="amberBox" x="0" y="0" rx="18" width="420" height="105"/>
    <text class="head" x="210" y="38" text-anchor="middle">OAuth Callback 服务</text>
    <text class="body" x="210" y="68" text-anchor="middle">127.0.0.1:8977 + Cloudflare Tunnel</text>
    <text class="small" x="210" y="91" text-anchor="middle">仅授权/重授权使用，不在日常调用链</text>
  </g>

  <g transform="translate(82,1010)">
    <rect class="greenBox" x="0" y="0" rx="16" width="400" height="105"/>
    <text class="head" x="24" y="37">Lazada Connector</text>
    <text class="body" x="24" y="67">OAuth · Seller · Orders · Products · Inventory</text>
    <text class="small" x="24" y="92">LIVE：40 店 · App 1/2 · MY / PH / TH</text>
  </g>
  <g transform="translate(505,1010)">
    <rect class="futureBox" x="0" y="0" rx="16" width="280" height="105"/>
    <text class="head" x="140" y="41" text-anchor="middle">Shopee Connector</text>
    <text class="small" x="140" y="72" text-anchor="middle">扩展接口已预留</text>
  </g>
  <g transform="translate(805,1010)">
    <rect class="futureBox" x="0" y="0" rx="16" width="280" height="105"/>
    <text class="head" x="140" y="41" text-anchor="middle">TikTok Connector</text>
    <text class="small" x="140" y="72" text-anchor="middle">扩展接口已预留</text>
  </g>
  <g transform="translate(1105,1010)">
    <rect class="futureBox" x="0" y="0" rx="16" width="280" height="105"/>
    <text class="head" x="140" y="41" text-anchor="middle">Mabang Connector</text>
    <text class="small" x="140" y="72" text-anchor="middle">标准 Connector 待实现</text>
  </g>
  <g transform="translate(1405,1010)">
    <rect class="grayBox" x="0" y="0" rx="16" width="390" height="105"/>
    <text class="head" x="195" y="37" text-anchor="middle">Connector Control Plane</text>
    <text class="body" x="195" y="67" text-anchor="middle">Platform · Shop · Authorization · API Log</text>
    <text class="small" x="195" y="91" text-anchor="middle">独立 SQLite WAL，不等于业务正式库</text>
  </g>

  <path class="line" d="M960 1155 L960 1185"/>

  <!-- Data -->
  <rect class="panel" x="50" y="1185" rx="24" width="1820" height="305"/>
  <text class="layer" x="82" y="1225">05 · BUSINESS DATA, STORAGE &amp; PROVIDER BOUNDARY</text>
  <g transform="translate(82,1250)">
    <rect class="grayBox" x="0" y="0" rx="18" width="1105" height="105"/>
    <text class="head" x="24" y="36">统一业务事实与主数据</text>
    <g>
      <rect class="blueBox" x="24" y="52" rx="11" width="175" height="34"/><text class="chip" x="112" y="75" text-anchor="middle">Product / SKU</text>
      <rect class="blueBox" x="214" y="52" rx="11" width="170" height="34"/><text class="chip" x="299" y="75" text-anchor="middle">Sales / Orders</text>
      <rect class="blueBox" x="399" y="52" rx="11" width="175" height="34"/><text class="chip" x="487" y="75" text-anchor="middle">Inventory</text>
      <rect class="blueBox" x="589" y="52" rx="11" width="190" height="34"/><text class="chip" x="684" y="75" text-anchor="middle">Listing / Price</text>
      <rect class="blueBox" x="794" y="52" rx="11" width="285" height="34"/><text class="chip" x="937" y="75" text-anchor="middle">Analytics / Growth / Audit</text>
    </g>
  </g>
  <g transform="translate(1208,1250)">
    <rect class="greenBox" x="0" y="0" rx="18" width="270" height="105"/>
    <text class="head" x="135" y="36" text-anchor="middle">SQLite 正式库</text>
    <text class="body" x="135" y="66" text-anchor="middle">当前生产 Provider</text>
    <text class="small" x="135" y="90" text-anchor="middle">业务事实与运行状态</text>
  </g>
  <g transform="translate(1498,1250)">
    <rect class="grayBox" x="0" y="0" rx="18" width="297" height="105"/>
    <text class="head" x="149" y="36" text-anchor="middle">受管文件存储</text>
    <text class="body" x="149" y="66" text-anchor="middle">图片 · Excel · 报告</text>
    <text class="small" x="149" y="90" text-anchor="middle">数据库仅保存元数据/引用</text>
  </g>
  <g transform="translate(82,1380)">
    <rect class="amberBox" x="0" y="0" rx="16" width="1713" height="75"/>
    <text class="head" x="24" y="31">Database Provider Abstraction</text>
    <text class="body" x="24" y="57">SQLite（当前生产） ⇄ Repository Compatibility ⇄ PostgreSQL Shadow / Staging / Cutover Rehearsal</text>
    <rect class="statusGuard" x="1390" y="22" rx="12" width="290" height="31"/>
    <text class="tiny" fill="#946200" x="1535" y="43" text-anchor="middle">演练通过 · 正式切换仍被阻止</text>
  </g>

  <path class="line" d="M960 1490 L960 1520"/>

  <!-- External -->
  <rect class="panel" x="50" y="1520" rx="24" width="1820" height="180"/>
  <text class="layer" x="82" y="1560">06 · EXTERNAL SYSTEMS</text>
  <g transform="translate(82,1585)">
    <rect class="greenBox" x="0" y="0" rx="16" width="310" height="78"/>
    <text class="head" x="155" y="34" text-anchor="middle">Lazada Open Platform</text>
    <text class="small" x="155" y="59" text-anchor="middle">已完成真实只读 API 链路</text>
  </g>
  <g transform="translate(415,1585)">
    <rect class="blueBox" x="0" y="0" rx="16" width="310" height="78"/>
    <text class="head" x="155" y="34" text-anchor="middle">Mabang ERP</text>
    <text class="small" x="155" y="59" text-anchor="middle">采集 Worker / Listing Sidecar</text>
  </g>
  <g transform="translate(748,1585)">
    <rect class="futureBox" x="0" y="0" rx="16" width="285" height="78"/>
    <text class="head" x="142" y="34" text-anchor="middle">Shopee API</text>
    <text class="small" x="142" y="59" text-anchor="middle">Connector 待接入</text>
  </g>
  <g transform="translate(1056,1585)">
    <rect class="futureBox" x="0" y="0" rx="16" width="285" height="78"/>
    <text class="head" x="142" y="34" text-anchor="middle">TikTok Shop API</text>
    <text class="small" x="142" y="59" text-anchor="middle">Connector 待接入</text>
  </g>
  <g transform="translate(1364,1585)">
    <rect class="violetBox" x="0" y="0" rx="16" width="431" height="78"/>
    <text class="head" x="216" y="34" text-anchor="middle">LLM / AI Provider</text>
    <text class="small" x="216" y="59" text-anchor="middle">仅经 AI Gateway 调用并记录审计</text>
  </g>

  <!-- Footer -->
  <text class="small" x="70" y="1735">实线：当前正式链路　·　虚线框：已预留但尚未完成　·　平台写操作默认关闭，需预览、审批、幂等与回读</text>
</svg>
