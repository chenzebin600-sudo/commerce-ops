<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>数据仓库查询</title>
    <link rel="stylesheet" href="/app.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#query-heading">跳至查询条件</a>
    <main>
      <header class="page-header">
        <div>
          <p class="eyebrow">运营数据工具</p>
          <h1>数据仓库查询</h1>
          <p class="lede">连接数据仓库后，按产品范围检索并导出可用数据。</p>
        </div>
      </header>

      <section class="panel connection-panel" aria-labelledby="connection-heading">
        <div class="section-heading">
          <div>
            <p class="section-kicker">步骤 1</p>
            <h2 id="connection-heading">连接数据仓库</h2>
          </div>
          <p id="connection-status" class="status" aria-live="polite">尚未连接</p>
        </div>
        <div class="connection-controls">
          <div class="field key-field">
            <label for="key-input">数据密钥</label>
            <div class="input-action">
              <input id="key-input" name="data-key" type="password" autocomplete="off" spellcheck="false" aria-describedby="key-help" required>
              <button id="toggle-key" class="button button-secondary" type="button" aria-pressed="false">显示</button>
            </div>
            <p id="key-help" class="help-text">密钥仅用于本次浏览器会话，不会显示在查询结果中。</p>
          </div>
          <button id="connect-button" class="button button-primary" type="button">连接</button>
        </div>
        <p id="scope-summary" class="scope-summary" aria-live="polite">连接后将显示你的数据范围。</p>
      </section>

      <div class="workspace-grid">
        <section class="panel query-panel" aria-labelledby="query-heading">
          <div class="section-heading">
            <div>
              <p class="section-kicker">步骤 2</p>
              <h2 id="query-heading">配置查询</h2>
            </div>
          </div>
          <div id="product-tabs" class="product-tabs" role="tablist" aria-label="选择数据产品">
            <button class="product-tab" type="button" role="tab" aria-selected="true" aria-controls="query-form" data-product="日销">日销</button>
            <button class="product-tab" type="button" role="tab" aria-selected="false" aria-controls="query-form" data-product="库存">库存</button>
            <button class="product-tab" type="button" role="tab" aria-selected="false" aria-controls="query-form" data-product="产品包">产品包</button>
            <button class="product-tab" type="button" role="tab" aria-selected="false" aria-controls="query-form" data-product="控价">控价</button>
          </div>
          <form id="query-form" aria-busy="false" novalidate>
            <fieldset>
              <legend>查询条件</legend>
              <div class="form-grid" id="query-parameters">
                <div class="field">
                  <label for="query-page-size">每页行数</label>
                  <select id="query-page-size" name="pageSize">
                    <option value="50">50</option>
                    <option value="100" selected>100</option>
                    <option value="250">250</option>
                    <option value="500">500</option>
                  </select>
                </div>
              </div>
            </fieldset>
            <div id="query-errors" class="message message-error" role="alert" aria-live="assertive" hidden></div>
            <button id="query-button" class="button button-primary" type="submit" disabled>查询数据</button>
          </form>
        </section>

        <section class="panel results-panel" aria-labelledby="results-heading" aria-busy="false">
          <div class="section-heading results-heading">
            <div>
              <p class="section-kicker">步骤 3</p>
              <h2 id="results-heading">查询结果</h2>
            </div>
            <p id="result-meta" class="result-meta" aria-live="polite">尚无结果</p>
          </div>
          <div class="table-wrap" tabindex="0" aria-label="查询结果表格，可横向滚动">
            <table id="result-table">
              <caption>数据仓库查询结果</caption>
              <thead>
                <tr><th scope="col">等待查询</th></tr>
              </thead>
              <tbody>
                <tr><td>提交查询后，结果将显示在这里。</td></tr>
              </tbody>
            </table>
          </div>
          <div id="empty-state" class="empty-state" role="status">
            <h3>准备好查询数据</h3>
            <p>先连接数据仓库，然后选择产品和筛选条件。</p>
          </div>
          <div class="result-actions">
            <button id="load-more-button" class="button button-secondary" type="button" disabled hidden>加载更多</button>
            <button id="export-button" class="button button-secondary" type="button" disabled>导出 CSV</button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
