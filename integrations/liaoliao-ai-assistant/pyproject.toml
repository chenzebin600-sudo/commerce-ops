[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "liaoliao-ai-assistant"
version = "0.4.0"
description = "ChatPlusAI (乐聊) message collector and human-confirmed AI draft assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "playwright>=1.51,<2",
  "python-dotenv>=1.1,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[project.scripts]
liaoliao = "app.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css", "migrations/*.sql"]

[tool.setuptools.data-files]
"." = ["selectors.json"]
"knowledge" = ["knowledge/README.md", "knowledge/global.md", "knowledge/shops.json", "knowledge/examples.jsonl"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
